<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<!-- สลิปจำลองสำหรับทดสอบ Vision — ธนาคาร บัญชี และชื่อเป็นข้อมูลสมมติทั้งหมด ไม่ใช่เอกสารจริง -->
<style>
  body { margin: 0; width: 420px; height: 640px; background: #e9eef5; font-family: "IBM Plex Sans Thai", sans-serif; display: flex; align-items: center; justify-content: center; }
  .slip { width: 380px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  .head { background: #3b5bab; color: #fff; padding: 16px 20px; }
  .head b { font-size: 18px; } .head small { display: block; opacity: .85; font-size: 12px; }
  .ok { text-align: center; padding: 18px 0 6px; color: #2c8a4b; font-weight: 700; font-size: 17px; }
  .amt { text-align: center; font-size: 34px; font-weight: 700; color: #1d2b3a; }
  .amt span { font-size: 16px; font-weight: 400; color: #667; }
  .date { text-align: center; color: #667; font-size: 13.5px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; padding: 9px 20px; border-top: 1px solid #edf0f4; font-size: 13.5px; }
  .row span { color: #778; } .row b { font-weight: 600; text-align: right; }
  .mock { text-align: center; font-size: 11px; color: #b33; padding: 10px; border-top: 1px dashed #e3c4c4; }
</style></head>
<body><div class="slip">
  <div class="head"><b>ธนาคารสวนสวย</b><small>Suan Suay Bank (จำลอง) · โอนเงินสำเร็จ</small></div>
  <div class="ok">✓ โอนเงินสำเร็จ</div>
  <div class="amt">1,460.00 <span>บาท</span></div>
  <div class="date">3 ต.ค. 69 · 14:25 น.</div>
  <div class="row"><span>จาก</span><b>นาย ทดสอบ ส.<br>xxx-x-x1234-x</b></div>
  <div class="row"><span>ไปยัง</span><b>บจก. บ้านใบเขียว<br>พร้อมเพย์ x-xxxx-xxxxx-xx-0</b></div>
  <div class="row"><span>เลขที่รายการ</span><b>MOCK20261003142500</b></div>
  <div class="row"><span>บันทึกช่วยจำ</span><b>BK-0003</b></div>
  <div class="mock">สลิปจำลองเพื่อการทดสอบ ไม่ใช่เอกสารทางการเงินจริง</div>
</div></body></html>
